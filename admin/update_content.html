<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Update Video</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
   <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_style.css') }}">
</head>
<body>
{% include 'components/admin_header.html' %}

<section class="video-form">
   <h1 class="heading">update content</h1>
   {% if video %}
   <form action="" method="post" enctype="multipart/form-data">
      <input type="hidden" name="video_id" value="{{ video.id }}">
      <input type="hidden" name="old_thumb" value="{{ video.thumb }}">
      <input type="hidden" name="old_video" value="{{ video.video }}">
      
      <p>update status <span>*</span></p>
      <select name="status" class="box" required>
         <option value="{{ video.status }}" selected>{{ video.status }}</option>
         <option value="active">active</option>
         <option value="deactive">deactive</option>
      </select>
      <p>update title <span>*</span></p>
      <input type="text" name="title" maxlength="100" required placeholder="enter video title" class="box" value="{{ video.title }}">
      <p>update description <span>*</span></p>
      <textarea name="description" class="box" required placeholder="write description" maxlength="1000" cols="30" rows="10">{{ video.description }}</textarea>
      
      <p>update playlist</p>
      <select name="playlist" class="box">
         <option value="{{ video.playlist_id }}" selected>--select playlist</option>
         {% if playlists %}
            {% for pl in playlists %}
            <option value="{{ pl.id }}">{{ pl.title }}</option>
            {% endfor %}
         {% endif %}
      </select>
      
      <img src="{{ url_for('static', filename='uploaded_files/' ~ video.thumb) }}" alt="">
      <p>update thumbnail</p>
      <input type="file" name="thumb" accept="image/*" class="box">
      
      <video src="{{ url_for('static', filename='uploaded_files/' ~ video.video) }}" controls></video>
      <p>update video</p>
      <input type="file" name="video" accept="video/*" class="box">
      
      <input type="submit" value="update content" name="update" class="btn">
      <div class="flex-btn">
         <a href="{{ url_for('admin.view_content', get_id=video.id) }}" class="option-btn">view content</a>
         <input type="submit" value="delete content" name="delete_video" class="delete-btn" onclick="return confirm('delete this video?');">
      </div>
   </form>
   {% else %}
      <p class="empty">video not found! <a href="{{ url_for('admin.add_content') }}" class="btn" style="margin-top: 1.5rem;">add videos</a></p>
   {% endif %}
</section>

{% include 'components/footer.html' %}
<script src="{{ url_for('static', filename='js/admin_script.js') }}"></script>
</body>
</html>
