<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Comments</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
   <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_style.css') }}">
</head>
<body>
{% include 'components/admin_header.html' %}

<section class="comments">
   <h1 class="heading">user comments</h1>
   <div class="show-comments">
      {% if comments %}
         {% for c in comments %}
         <div class="box">
            <div class="content">
               <span>{{ c.date }}</span>
               <p> - {{ c.content_title }} - </p>
               <a href="{{ url_for('admin.view_content', get_id=c.content_id) }}">view content</a>
            </div>
            <p class="text">{{ c.comment }}</p>
            <form action="" method="post">
               <input type="hidden" name="comment_id" value="{{ c.id }}">
               <button type="submit" name="delete_comment" class="inline-delete-btn" onclick="return confirm('delete this comment?');">delete comment</button>
            </form>
         </div>
         {% endfor %}
      {% else %}
         <p class="empty">no comments added yet!</p>
      {% endif %}
   </div>
</section>

{% include 'components/footer.html' %}
<script src="{{ url_for('static', filename='js/admin_script.js') }}"></script>
</body>
</html>
